name: Deploy RutaExpress Backend to EC2 via GHCR

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and package with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Deploy to EC2 via SSH
        if: ${{ vars.TARGET_HOST_IP != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            echo "=== CONECTADO A EC2: ${{ vars.TARGET_HOST_IP }} ==="
            cd /home/ec2-user
            
            if [ ! -d "rutaexpress-backend" ]; then
              git clone -b develop https://github.com/${{ github.repository }}.git
              cd rutaexpress-backend
            else
              cd rutaexpress-backend
              git fetch origin
              git checkout develop
              git reset --hard origin/develop
            fi
            
            echo "=== CONSTRUYENDO Y LEVANTANDO CONTENEDORES ==="
            docker compose down || true
            docker compose up -d --build
            
            echo "=== ESTADO DE CONTENEDORES ==="
            docker compose ps
