name: Deploy RutaExpress Backend to EC2 via GHCR

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build all microservices with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Catalog image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-catalog/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-catalog:latest

      - name: Build and push Audit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-audit/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-audit:latest

      - name: Build and push Shipments image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-shipments/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-shipments:latest

      - name: Build and push BFF image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-bff/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-bff:latest

      - name: Deploy to EC2 via SSH
        if: ${{ vars.TARGET_HOST_IP != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            echo "=== CONECTADO A EC2: ${{ vars.TARGET_HOST_IP }} ==="
            cd /home/ec2-user
            
            if [ ! -d "rutaexpress-backend" ]; then
              git clone -b develop https://github.com/${{ github.repository }}.git
              cd rutaexpress-backend
            else
              cd rutaexpress-backend
              git fetch origin
              git checkout develop
              git reset --hard origin/develop
            fi
            
            echo "=== DESCARGANDO IMAGENES PRECONSTRUIDAS ==="
            docker compose pull
            
            echo "=== INICIANDO CONTENEDORES ==="
            docker compose down || true
            docker compose up -d
            
            echo "=== ESTADO DE CONTENEDORES ==="
            docker compose ps
