name: Deploy RutaExpress Backend to EC2 via GHCR

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to EC2 Instance via SSH
        if: ${{ vars.TARGET_HOST_IP != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Conectado exitosamente a EC2: ${{ vars.TARGET_HOST_IP }}"
            # Actualizar o clonar el repositorio
            if [ -d "rutaexpress-backend" ]; then
              cd rutaexpress-backend
              git fetch origin
              git checkout develop
              git pull origin develop
            else
              git clone https://github.com/${{ github.repository }}.git
              cd rutaexpress-backend
              git checkout develop
            fi

            # Compilar e iniciar contenedores con Docker Compose
            mvn clean package -DskipTests
            docker compose down || true
            docker compose up -d --build
            docker compose ps
