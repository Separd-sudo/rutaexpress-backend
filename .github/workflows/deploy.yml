name: Deploy RutaExpress Backend to EC2 via GHCR

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to EC2 Instance via SSH
        if: ${{ vars.TARGET_HOST_IP != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            echo "=== [PASO 1/4] CONEXION SSH ESTABLECIDA CON EC2 ==="
            cd /home/ec2-user
            
            echo "=== [PASO 2/4] ACTUALIZANDO CODIGO DESDE GITHUB ==="
            if [ -d "rutaexpress-backend" ]; then
              cd rutaexpress-backend
              git fetch origin
              git checkout develop
              git reset --hard origin/develop
            else
              git clone -b develop https://github.com/${{ github.repository }}.git
              cd rutaexpress-backend
            fi
            
            echo "=== [PASO 3/4] COMPILANDO MICROSERVICIOS CON MAVEN ==="
            mvn clean package -DskipTests -q
            
            echo "=== [PASO 4/4] DESPLEGANDO CONTENEDORES CON DOCKER COMPOSE ==="
            docker compose down || true
            docker compose up -d --build
            
            echo "=== DESPLIEGUE FINALIZADO EXITOSAMENTE ==="
            docker compose ps
