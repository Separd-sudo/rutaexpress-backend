name: Deploy RutaExpress Backend to EC2 via GHCR

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build all microservices with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Catalog image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-catalog/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-catalog:latest

      - name: Build and push Audit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-audit/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-audit:latest

      - name: Build and push Shipments image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-shipments/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-shipments:latest

      - name: Build and push BFF image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-bff/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-bff:latest

      - name: Deploy to EC2 via Native SSH
        if: ${{ vars.TARGET_HOST_IP != '' }}
        env:
          EC2_IP: ${{ vars.TARGET_HOST_IP }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          
          ssh -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa \
              -i ~/.ssh/ec2_key \
              ec2-user@$EC2_IP \
              "bash -s" << EOF
            set -e
            echo "=== CONECTADO A EC2: $EC2_IP ==="
            cd /home/ec2-user

            # 1. Configurar Swap de 2GB si no existe
            if [ ! -f /swapfile ]; then
              echo "=== CREANDO SWAPFILE DE 2GB ==="
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab || true
            fi
            
            # 2. Detectar comando docker (con o sin sudo)
            DOCKER="docker"
            if ! docker ps > /dev/null 2>&1; then
              DOCKER="sudo docker"
            fi

            # 3. Clonar o actualizar repositorio
            if [ ! -d "rutaexpress-backend/.git" ]; then
              rm -rf rutaexpress-backend
              git clone -b $BRANCH https://github.com/$REPO.git rutaexpress-backend
            fi
            
            cd rutaexpress-backend
            git fetch origin
            git checkout $BRANCH
            git reset --hard origin/$BRANCH
            
            # 4. Autenticar con GHCR y descargar imagenes
            echo "=== AUTENTICANDO CON GHCR EN EC2 ==="
            echo "$GH_TOKEN" | \$DOCKER login ghcr.io -u $GH_ACTOR --password-stdin
            
            echo "=== DESCARGANDO IMAGENES PRECONSTRUIDAS ==="
            \$DOCKER compose pull
            
            echo "=== INICIANDO CONTENEDORES OPTIMIZADOS ==="
            \$DOCKER compose down --remove-orphans || true
            \$DOCKER compose up -d
            
            echo "=== ESTADO DE CONTENEDORES ==="
            \$DOCKER compose ps
          EOF
