name: Deploy RutaExpress Backend to EC2 via GHCR

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and package with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Copy JARs and configs to EC2 via SCP
        if: ${{ vars.TARGET_HOST_IP != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,docker/init-db/*,ms-rutaexpress-catalog/target/*.jar,ms-rutaexpress-catalog/Dockerfile,ms-rutaexpress-audit/target/*.jar,ms-rutaexpress-audit/Dockerfile,ms-rutaexpress-shipments/target/*.jar,ms-rutaexpress-shipments/Dockerfile,ms-rutaexpress-bff/target/*.jar,ms-rutaexpress-bff/Dockerfile"
          target: "/home/ec2-user/rutaexpress-backend"

      - name: Run Docker Compose on EC2 via SSH
        if: ${{ vars.TARGET_HOST_IP != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            echo "=== CONECTADO A EC2: ${{ vars.TARGET_HOST_IP }} ==="
            cd /home/ec2-user/rutaexpress-backend
            
            echo "=== LEVANTANDO CONTENEDORES CON DOCKER COMPOSE ==="
            docker compose down || true
            docker compose up -d --build
            
            echo "=== ESTADO DE CONTENEDORES ==="
            docker compose ps
            echo "=== DESPLIEGUE FINALIZADO EXITOSAMENTE ==="
