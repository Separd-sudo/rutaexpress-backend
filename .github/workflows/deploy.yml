name: CI/CD RutaExpress Build Push Deploy EC2 EP3

on:
  push:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  RDS_PORT: 5432
  RDS_USERNAME: postgres

jobs:
  build-push-deploy:
    name: Build, Push to GHCR and Deploy to EC22
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Descarga el código fuente desde GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17 para compilar los microservicios
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Compilar los microservicios con Maven
      - name: Build all microservices with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      # 4. Configurar el constructor de Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Autenticar con el Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Construir y subir las 5 imágenes a GHCR
      - name: Build and push Catalog image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-catalog/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-catalog:latest

      - name: Build and push Audit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-audit/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-audit:latest

      - name: Build and push RabbitMQ Microservice image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-rabbitmq/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-rabbitmq:latest

      - name: Build and push Shipments image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-shipments/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-shipments:latest

      - name: Build and push BFF image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ms-rutaexpress-bff/Dockerfile
          push: true
          tags: ghcr.io/separd-sudo/ms-rutaexpress-bff:latest

      # 7. Desplegar en EC2 via SSH (GitOps / CD automático)
      - name: Deploy to EC2 via SSH
        env:
          EC2_IP: ${{ secrets.TARGET_HOST_IP }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_PORT: ${{ env.RDS_PORT }}
          RDS_USERNAME: ${{ env.RDS_USERNAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa \
              -i ~/.ssh/ec2_key \
              ec2-user@$EC2_IP \
              "bash -s" << 'EOF'
            set -e
            set -x # <--- ESTO HARÁ QUE SE VEAN TODOS LOS COMANDOS EN EL LOG
            echo "=== CONECTADO A EC2: $EC2_IP ==="
            cd /home/ec2-user

            # 1. Swap para rendimiento en EC2
            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab || true
            fi

            # 2. Descargar o actualizar el repositorio (Con token para evitar errores si es privado)
            if [ ! -d "rutaexpress-backend/.git" ]; then
              rm -rf rutaexpress-backend
              git clone -b $BRANCH https://x-access-token:$GH_TOKEN@github.com/$REPO.git rutaexpress-backend
            fi

            cd rutaexpress-backend
            git fetch origin
            git checkout $BRANCH
            git reset --hard origin/$BRANCH

            # 3. Configurar variables de base de datos
            cat << ENVEOF > .env
            RDS_HOST=${RDS_HOST}
            RDS_PORT=${RDS_PORT}
            RDS_USERNAME=${RDS_USERNAME}
            RDS_PASSWORD=${RDS_PASSWORD}
            ENVEOF

            # 4. Autenticar con GHCR y descargar imagenes (usando sudo docker por permisos)
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u $GH_ACTOR --password-stdin
            sudo docker compose pull

            # 5. Iniciar contenedores + Cluster RabbitMQ (2 nodos)
            sudo docker compose down --remove-orphans || true
            sudo docker compose up -d
            sudo docker compose ps
            sudo docker exec rabbitmq-1 rabbitmqctl cluster_status || true
          EOF