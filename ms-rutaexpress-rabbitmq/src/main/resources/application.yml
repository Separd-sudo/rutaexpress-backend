server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-rutaexpress-rabbitmq
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rutaexpress}
    password: ${SPRING_RABBITMQ_PASSWORD:rutaexpress123}
    virtual-host: /
    connection-timeout: 10000
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 3
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-attempts: 3

rabbitmq:
  exchanges:
    direct: ${RABBITMQ_EXCHANGE_DIRECT:cmd.direct}
    topic: ${RABBITMQ_EXCHANGE_TOPIC:cmd.topic}
    dlx: ${RABBITMQ_EXCHANGE_DLX:cmd.dead.dlx}
  queues:
    warehouse: ${RABBITMQ_QUEUE_WAREHOUSE:q.cmd.warehouse}
    warehouse-dlq: ${RABBITMQ_QUEUE_WAREHOUSE_DLQ:q.cmd.warehouse.dlq}
    label: ${RABBITMQ_QUEUE_LABEL:q.cmd.label}
    label-dlq: ${RABBITMQ_QUEUE_LABEL_DLQ:q.cmd.label.dlq}
  routing-keys:
    warehouse-direct: ${RABBITMQ_RK_WAREHOUSE_DIRECT:warehouse.ticket}
    warehouse-topic: ${RABBITMQ_RK_WAREHOUSE_TOPIC:warehouse.#}
    warehouse-dlq: ${RABBITMQ_RK_WAREHOUSE_DLQ:warehouse.dead}
    label-direct: ${RABBITMQ_RK_LABEL_DIRECT:label.gen}
    label-topic: ${RABBITMQ_RK_LABEL_TOPIC:label.*}
    label-dlq: ${RABBITMQ_RK_LABEL_DLQ:label.dead}
  ttl:
    main-ms: 30000
    dlq-ms: 86400000

services:
  audit:
    url: ${AUDIT_SERVICE_URL:http://127.0.0.1:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
