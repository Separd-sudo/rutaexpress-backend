server:
  port: 8080

spring:
  application:
    name: ms-rutaexpress-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_JWT_ISSUER_URI:https://sts.windows.net/b7bd70fc-34e6-4f0c-80cc-e0909f96d096/}
          jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/b7bd70fc-34e6-4f0c-80cc-e0909f96d096/discovery/v2.0/keys}

security:
  azure:
    enabled: ${SECURITY_AZURE_ENABLED:false}

services:
  shipments:
    url: ${SHIPMENTS_SERVICE_URL:http://127.0.0.1:8081}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://127.0.0.1:8082}
  audit:
    url: ${AUDIT_SERVICE_URL:http://127.0.0.1:8083}
  rabbitmq:
    url: ${RABBITMQ_SERVICE_URL:http://127.0.0.1:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html