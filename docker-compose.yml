version: '3.8'

networks:
  rutaexpress-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: rtx-postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-svc:
    build:
      context: .
      dockerfile: ms-rutaexpress-catalog/Dockerfile
    container_name: rtx-catalog-svc
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress_catalog
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  audit-svc:
    build:
      context: .
      dockerfile: ms-rutaexpress-audit/Dockerfile
    container_name: rtx-audit-svc
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress_audit
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  shipments-svc:
    build:
      context: .
      dockerfile: ms-rutaexpress-shipments/Dockerfile
    container_name: rtx-shipments-svc
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress_shipments
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - CATALOG_SERVICE_URL=http://catalog-svc:8082
      - AUDIT_SERVICE_URL=http://audit-svc:8083
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      postgres-db:
        condition: service_healthy
      catalog-svc:
        condition: service_healthy
      audit-svc:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  bff-svc:
    build:
      context: .
      dockerfile: ms-rutaexpress-bff/Dockerfile
    container_name: rtx-bff-svc
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SHIPMENTS_SERVICE_URL=http://shipments-svc:8081
      - CATALOG_SERVICE_URL=http://catalog-svc:8082
      - AUDIT_SERVICE_URL=http://audit-svc:8083
      - SECURITY_AZURE_ENABLED=false
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      shipments-svc:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/bff/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s