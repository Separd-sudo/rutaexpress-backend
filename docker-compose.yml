networks:
  rutaexpress-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  rabbitmq-data-1:
    driver: local
  rabbitmq-data-2:
    driver: local

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: rtx-postgres-db
    restart: unless-stopped
    profiles:
      - local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${RDS_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${RDS_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq-1:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-rutaexpress}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-rutaexpress123}
      - RABBITMQ_ERLANG_COOKIE=rutaexpress_secret_cluster_cookie
    volumes:
      - rabbitmq-data-1:/var/lib/rabbitmq
      - ./infra/mq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 25s

  rabbitmq-2:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-rutaexpress}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-rutaexpress123}
      - RABBITMQ_ERLANG_COOKIE=rutaexpress_secret_cluster_cookie
    volumes:
      - rabbitmq-data-2:/var/lib/rabbitmq
      - ./infra/mq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 25s

  catalog-svc:
    image: ghcr.io/separd-sudo/ms-rutaexpress-catalog:latest
    build:
      context: .
      dockerfile: ./ms-rutaexpress-catalog/Dockerfile
    container_name: rtx-catalog-svc
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${RDS_HOST:-postgres-db}:${RDS_PORT:-5432}/rutaexpress_catalog
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD:-postgres}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms96m -Xmx192m
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  audit-svc:
    image: ghcr.io/separd-sudo/ms-rutaexpress-audit:latest
    build:
      context: .
      dockerfile: ./ms-rutaexpress-audit/Dockerfile
    container_name: rtx-audit-svc
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${RDS_HOST:-postgres-db}:${RDS_PORT:-5432}/rutaexpress_audit
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD:-postgres}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms96m -Xmx192m
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  rabbitmq-svc:
    image: ghcr.io/separd-sudo/ms-rutaexpress-rabbitmq:latest
    build:
      context: .
      dockerfile: ./ms-rutaexpress-rabbitmq/Dockerfile
    container_name: rtx-rabbitmq-svc
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq-1}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - SPRING_RABBITMQ_ADDRESSES=${RABBITMQ_ADDRESSES:-rabbitmq-1:5672,rabbitmq-2:5672}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-rutaexpress}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rutaexpress123}
      - AUDIT_SERVICE_URL=http://audit-svc:8083
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms96m -Xmx192m
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      audit-svc:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/api/rabbitmq/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  shipments-svc:
    image: ghcr.io/separd-sudo/ms-rutaexpress-shipments:latest
    build:
      context: .
      dockerfile: ./ms-rutaexpress-shipments/Dockerfile
    container_name: rtx-shipments-svc
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${RDS_HOST:-postgres-db}:${RDS_PORT:-5432}/rutaexpress_shipments
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD:-postgres}
      - CATALOG_SERVICE_URL=http://catalog-svc:8082
      - AUDIT_SERVICE_URL=http://audit-svc:8083
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq-1}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - SPRING_RABBITMQ_ADDRESSES=${RABBITMQ_ADDRESSES:-rabbitmq-1:5672,rabbitmq-2:5672}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-rutaexpress}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rutaexpress123}
      - RABBITMQ_ENABLED=true
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms96m -Xmx192m
    depends_on:
      catalog-svc:
        condition: service_healthy
      audit-svc:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  bff-svc:
    image: ghcr.io/separd-sudo/ms-rutaexpress-bff:latest
    build:
      context: .
      dockerfile: ./ms-rutaexpress-bff/Dockerfile
    container_name: rtx-bff-svc
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SHIPMENTS_SERVICE_URL=http://shipments-svc:8081
      - CATALOG_SERVICE_URL=http://catalog-svc:8082
      - AUDIT_SERVICE_URL=http://audit-svc:8083
      - RABBITMQ_SERVICE_URL=http://rabbitmq-svc:8084
      - SECURITY_AZURE_ENABLED=${SECURITY_AZURE_ENABLED:-false}
      - AZURE_JWT_ISSUER_URI=${AZURE_JWT_ISSUER_URI:-https://sts.windows.net/b7bd70fc-34e6-4f0c-80cc-e0909f96d096/}
      - AZURE_JWK_SET_URI=${AZURE_JWK_SET_URI:-https://login.microsoftonline.com/b7bd70fc-34e6-4f0c-80cc-e0909f96d096/discovery/v2.0/keys}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms96m -Xmx192m
    depends_on:
      shipments-svc:
        condition: service_healthy
      rabbitmq-svc:
        condition: service_healthy
    networks:
      - rutaexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/bff/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s