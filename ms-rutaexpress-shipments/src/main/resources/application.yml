server:
  port: 8081

spring:
  application:
    name: ms-rutaexpress-shipments
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rutaexpress_shipments}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rutaexpress}
    password: ${SPRING_RABBITMQ_PASSWORD:rutaexpress123}
    connection-timeout: 5000

rabbitmq:
  enabled: ${RABBITMQ_ENABLED:true}
  exchanges:
    direct: ${RABBITMQ_EXCHANGE_DIRECT:cmd.direct}
    topic: ${RABBITMQ_EXCHANGE_TOPIC:cmd.topic}
  routing-keys:
    warehouse-direct: ${RABBITMQ_RK_WAREHOUSE_DIRECT:warehouse.ticket}
    label-direct: ${RABBITMQ_RK_LABEL_DIRECT:label.gen}

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://127.0.0.1:8082}
  audit:
    url: ${AUDIT_SERVICE_URL:http://127.0.0.1:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html