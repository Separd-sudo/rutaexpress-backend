server:
  port: 8085

spring:
  application:
    name: ms-rutaexpress-report
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rutaexpress_report}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

kafka:
  topics:
    shipments-events: ${KAFKA_TOPIC_SHIPMENTS_EVENTS:shipments.events}
    audit-timeline: ${KAFKA_TOPIC_AUDIT_TIMELINE:audit.timeline}
    dlt-suffix: .report.DLT
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP:report-svc}
    # Grupo independiente para audit.timeline: su lag se monitorea por separado
    timeline-group-id: ${KAFKA_TIMELINE_CONSUMER_GROUP:report-timeline-svc}
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
  retry:
    max-attempts: 3

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
